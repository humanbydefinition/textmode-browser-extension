<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>ASCII Overlay Fixture</title>
		<style>
			body {
				margin: 0;
				display: grid;
				gap: 24px;
				padding: 24px;
				background: #111827;
			}
			canvas,
			video,
			iframe {
				width: 320px;
				height: 180px;
				background: #020617;
				border: 0;
			}
		</style>
	</head>
	<body>
		<canvas id="demo-canvas" width="320" height="180"></canvas>
		<video id="demo-video" width="320" height="180" muted playsinline></video>
		<iframe id="same-origin-frame" src="/iframe-media" title="same-origin media"></iframe>
		<iframe id="nested-root-frame" src="/iframe-nested-root" title="nested same-origin media"></iframe>
		<iframe
			id="cross-origin-frame"
			src="http://localhost:__SERVER_PORT__/iframe-dynamic"
			title="cross-origin media"
		></iframe>
		<iframe
			id="srcdoc-frame"
			title="srcdoc media"
			srcdoc="<!doctype html><style>html,body{margin:0;background:#020617}canvas{width:320px;height:180px}</style><canvas id='srcdoc-canvas' width='320' height='180'></canvas>"
		></iframe>
		<script>
			const canvas = document.querySelector('#demo-canvas');
			const ctx = canvas.getContext('2d');
			let frame = 0;
			function draw() {
				frame += 1;
				ctx.fillStyle = '#020617';
				ctx.fillRect(0, 0, canvas.width, canvas.height);
				ctx.fillStyle = '#38bdf8';
				ctx.fillRect(30 + Math.sin(frame / 20) * 20, 50, 80, 60);
				ctx.fillStyle = '#f8fafc';
				ctx.font = '24px monospace';
				ctx.fillText('ASCII', 150, 96);
				requestAnimationFrame(draw);
			}
			draw();
		</script>
	</body>
</html>
